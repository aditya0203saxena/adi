<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POLARIS Operations Module</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--ink:#102536;--muted:#607985;--line:rgba(34,72,91,.13);--aqua:#008f9c;--amber:#d98b1d;--green:#4d9b78}*{box-sizing:border-box}body{margin:0;padding:15px;background:linear-gradient(135deg,#f9fcfd,#e9f3f6);color:var(--ink);font:13px Inter,"Segoe UI",sans-serif}.k{font:600 8px "IBM Plex Mono",monospace;letter-spacing:.14em;color:#7a8e97}.title{font:800 16px "IBM Plex Mono",monospace;margin:5px 0 7px;letter-spacing:.03em}.desc{margin:0 0 13px;color:var(--muted);line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{padding:11px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.78);box-shadow:0 3px 12px rgba(47,82,94,.04)}.label{font:600 8px "IBM Plex Mono",monospace;color:#7a8e97;letter-spacing:.1em}.value{margin-top:5px;font:800 11px "IBM Plex Mono",monospace;color:#365b6b}.ok{color:var(--green)}.warn{color:var(--amber)}.note{margin-top:12px;padding:9px;border-left:2px solid var(--aqua);background:rgba(0,143,156,.045);color:#607985;font-size:10px;line-height:1.45}</style></head><body><div id="app"></div><script>const modules={ground:{title:'GROUND STATION & DRS',desc:'Satellite tracking, DRS, RF link availability and mission-control events.',cards:[['DRS LINK','WAITING','warn'],['SATELLITE PASS','SCHEDULED','ok'],['HF STORM','NO DATA','warn'],['MAINTENANCE','READY','ok']]},meteorology:{title:'METEOROLOGY & RESILIENCE',desc:'Atmospheric resilience view driven by normalized station observations.',cards:[['BLIZZARD WARNING','NO DATA','warn'],['RAIN / SLUSH','NO DATA','warn'],['LiDAR','STANDBY','ok'],['WIND VECTOR','NO DATA','warn']]},compliance:{title:'REGULATORY & COMPLIANCE',desc:'Operational checklist for permits, EIA, waste handling and biosecurity.',cards:[['PERMIT','TRACKED','ok'],['EIA','TRACKED','ok'],['WASTE','CHECK REQUIRED','warn'],['BIOSECURITY','TRACKED','ok']]},'well-being':{title:'WINTER-OVER WELL-BEING',desc:'Anonymous crew support workflow for routine check-ins and peer resources.',cards:[['CHECK-IN','READY','ok'],['SLEEP HYGIENE','AVAILABLE','ok'],['PEER SUPPORT','AVAILABLE','ok'],['ESCALATION','PRIVATE','ok']]},infrastructure:{title:'INFRASTRUCTURE & HERITAGE',desc:'Asset condition, access routes, preservation records and station readiness.',cards:[['SITE ACCESS','NO DATA','warn'],['PRESERVATION','TRACKED','ok'],['HERITAGE LOG','READY','ok'],['ASSET HEALTH','NO DATA','warn']]}};const key=new URLSearchParams(location.search).get('module')||'ground',m=modules[key]||modules.ground;document.querySelector('#app').innerHTML=`<div class="k">POLARIS OPS // MODULE ${key.toUpperCase()}</div><div class="title">${m.title}</div><p class="desc">${m.desc}</p><div class="grid">${m.cards.map(c=>`<div class="card"><div class="label">${c[0]}</div><div class="value ${c[2]}">${c[1]}</div></div>`).join('')}</div><div class="note">Prototype operational layer. Live safety decisions must use validated station systems and authoritative environmental data.</div>`;</script></body></html>
