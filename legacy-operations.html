<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POLARIS Operations Module</title><style>body{margin:0;padding:18px;background:#07131e;color:#edf6fb;font:14px Inter,"Segoe UI",sans-serif}h2{margin:6px 0 8px;font:700 18px "IBM Plex Mono",Consolas,monospace}p{color:#8ea9b7;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{border:1px solid rgba(140,204,232,.18);border-radius:10px;padding:12px;background:#0c1b2a}.label{font:700 9px "IBM Plex Mono",Consolas,monospace;color:#5f7f8f;letter-spacing:.1em}.value{margin-top:5px;font-weight:700}.ok{color:#7ae8dc}.warn{color:#ffc56b}</style></head><body><div id="app"></div><script>const modules={ground:{title:'GROUND STATION',desc:'Satellite tracking, DRS, RF link availability and mission-control events.',cards:[['DRS LINK','WAITING','warn'],['SATELLITE PASS','SCHEDULED','ok'],['HF STORM','NO DATA','warn'],['MAINTENANCE','READY','ok']]},meteorology:{title:'METEOROLOGY',desc:'Atmospheric resilience view driven by normalized station observations.',cards:[['BLIZZARD WARNING','NO DATA','warn'],['RAIN / SLUSH','NO DATA','warn'],['LiDAR','STANDBY','ok'],['WIND VECTOR','NO DATA','warn']]},compliance:{title:'COMPLIANCE',desc:'Operational checklist for permits, environmental assessment, waste and biosecurity.',cards:[['PERMIT','TRACKED','ok'],['EIA','TRACKED','ok'],['WASTE','CHECK REQUIRED','warn'],['BIOSECURITY','TRACKED','ok']]},'well-being':{title:'WINTER-OVER WELL-BEING',desc:'Anonymous crew support workflow for routine check-ins and peer resources.',cards:[['CHECK-IN','READY','ok'],['SLEEP HYGIENE','AVAILABLE','ok'],['PEER FORUM','AVAILABLE','ok'],['ESCALATION','PRIVATE','ok']]},infrastructure:{title:'INFRASTRUCTURE & HERITAGE',desc:'Asset condition, access routes, preservation records and station readiness.',cards:[['SITE ACCESS','NO DATA','warn'],['PRESERVATION','TRACKED','ok'],['HERITAGE LOG','READY','ok'],['ASSET HEALTH','NO DATA','warn']]}};const key=new URLSearchParams(location.search).get('module')||'ground';const m=modules[key]||modules.ground;document.querySelector('#app').innerHTML=`<div class="label">POLARIS OPS // MODULE ${key.toUpperCase()}</div><h2>${m.title}</h2><p>${m.desc}</p><div class="grid">${m.cards.map(c=>`<div class="card"><div class="label">${c[0]}</div><div class="value ${c[2]}">${c[1]}</div></div>`).join('')}</div>`;</script></body></html>
